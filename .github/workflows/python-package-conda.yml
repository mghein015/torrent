name: Torrent to Hugging Face (aria2)

on:
  workflow_dispatch:
    inputs:
      torrent_link:
        description: 'Magnet link or .torrent URL'
        required: true
      hf_repo:
        description: 'HF Repo (e.g., username/my-dataset)'
        required: true

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install aria2 and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2
          pip install huggingface_hub

      - name: Run Script
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 download_and_upload.py \
            "${{ github.event.inputs.torrent_link }}" \
            "${{ github.event.inputs.hf_repo }}" \
            "$HF_TOKEN"
